# Serves the adapter-static build. The root filesystem is read-only in the
# Helm chart, so everything nginx writes goes to /tmp (an emptyDir).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        absolute_redirect off;

        # Routes have no trailing slash; /foo/ would otherwise hit a bare directory.
        rewrite ^/(.+)/$ /$1 permanent;

        # Prerendered routes are emitted as /foo.html (same lookup GitHub Pages does).
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }

        location /_app/immutable/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        error_page 404 /404.html;
    }
}
