apiVersion: v1
kind: ServiceAccount
metadata:
  name: argoplane-vulnerabilities-backend
  namespace: argocd
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argoplane-vulnerabilities-manager
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports", "exposedsecretreports", "sbomreports"]
    verbs: ["get", "list", "watch"]
  # Reads ArgoCD Applications to authorize namespace scoping.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argoplane-vulnerabilities-manager-binding
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argoplane-vulnerabilities-manager
subjects:
  - kind: ServiceAccount
    name: argoplane-vulnerabilities-backend
    namespace: argocd
---
# Reading the cluster Secrets ArgoCD registers is how the backend reaches a
# cluster other than its own. Namespaced on purpose: the same rule in the
# ClusterRole above would hand it every Secret in the cluster.
#
# Only used where ArgoCD manages other clusters. In a single-cluster setup the
# backend never looks a Secret up, so this grant simply goes unused.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argoplane-vulnerabilities-clusters
  namespace: argocd
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
rules:
  # list only: the backend discovers the right Secret by scanning the labelled
  # set, and never fetches one by name. RBAC cannot filter by label, so this is
  # as narrow as the lookup allows.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argoplane-vulnerabilities-clusters
  namespace: argocd
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argoplane-vulnerabilities-clusters
subjects:
  - kind: ServiceAccount
    name: argoplane-vulnerabilities-backend
    namespace: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argoplane-vulnerabilities-backend
  namespace: argocd
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argoplane-vulnerabilities-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argoplane-vulnerabilities-backend
        app.kubernetes.io/part-of: argoplane
    spec:
      serviceAccountName: argoplane-vulnerabilities-backend
      containers:
        - name: backend
          image: argoplane-vulnerabilities-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              protocol: TCP
          env:
            - name: PORT
              value: "8084"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: argoplane-vulnerabilities-backend
  namespace: argocd
  labels:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
    app.kubernetes.io/part-of: argoplane
spec:
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
  selector:
    app.kubernetes.io/name: argoplane-vulnerabilities-backend
